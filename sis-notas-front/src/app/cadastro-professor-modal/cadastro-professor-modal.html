<h2 style="padding-left: 10px;" mat-dialog-title>Cadastrar Professor</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup">

  <div class="col-12">
     <mat-form-field appearance="fill">
       <mat-label>Nome</mat-label>
       <input matInput formControlName="nome">
     </mat-form-field>
    </div>

    <div class="col-12">
     <mat-form-field appearance="fill">
       <mat-label>Email</mat-label>
       <input matInput formControlName="email">
     </mat-form-field>
    </div>

    <div class="col-12">
     <mat-form-field appearance="fill">
       <mat-label>Senha</mat-label>
       <input matInput type="password" formControlName="senha">
     </mat-form-field>
    </div>

    <div class="col-12">
     <mat-form-field appearance="fill">
       <mat-label>Confirmar Senha</mat-label>
       <input matInput type="password" formControlName="senhaConfirmar">
     </mat-form-field>
    </div>

    <div class="col-12">
     <mat-form-field appearance="fill">
       <mat-label>Telefone</mat-label>
       <input matInput formControlName="telefone">
     </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="formGroup.invalid">Salvar</button>
</mat-dialog-actions>
