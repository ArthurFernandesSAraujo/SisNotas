<app-menu></app-menu>

<h1 style="padding-left: 40px;">Bem Vindo Professor(a)!</h1>
<h2 style="padding-left: 40px;">Lançar Notas:</h2>

<div class="container mt-4">
  <div class="card">
    <h3>Notas por Disciplina</h3>

    <div class="tabela-container">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

        <!-- ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let e">{{ e.id }}</td>
        </ng-container>

        <!-- Nome -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome do Aluno</th>
          <td mat-cell *matCellDef="let e">{{ e.nome }}</td>
        </ng-container>

        <!-- Disciplina -->
        <ng-container matColumnDef="disciplina">
          <th mat-header-cell *matHeaderCellDef>Disciplina</th>
          <td mat-cell *matCellDef="let e">{{ e.disciplina }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let e">{{ e.status }}</td>
        </ng-container>

        <!-- Nota -->
        <ng-container matColumnDef="nota">
          <th mat-header-cell *matHeaderCellDef>Nota</th>
          <td mat-cell *matCellDef="let aluno">
            <div style="display:flex; align-items:center; gap:5px;">
              <input matInput type="number" min="0" max="10" [(ngModel)]="aluno.nota" placeholder="Nota">
              <button mat-icon-button color="primary" (click)="salvarNota(aluno)" matTooltip="Salvar">
                <mat-icon>save</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </div>
</div>
